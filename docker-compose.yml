services:
  db:
    image: postgres:15-alpine
    container_name: complaint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: complaint_db
      POSTGRES_USER: complaint_user
      POSTGRES_PASSWORD: complaint_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaint_user -d complaint_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: complaint-backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-for-local-container-test
      - DATABASE_URL=postgres://complaint_user:complaint_password@db:5432/complaint_db
      - CORS_ALLOW_ALL_ORIGINS=True
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: complaint-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

